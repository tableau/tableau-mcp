name: Generate NodeJS Single Executable Application

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      web_only:
        description: Build and package the Web executable only, as a release does
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/upload-binaries.yml
      - package.json
      - package-lock.json
      - src/scripts/build*.ts
      - src/scripts/sea*.ts
      - src/utils/sea.ts
      - src/utils/loadProviderModule.ts
      - src/server.web.ts
      - src/features/serverFeatureGate.ts
      - src/desktop/assets.ts
      - src/tools/web/scaffoldDataApp/dataAppWorkspaceStore.ts
      - src/templates/**
      - src/index*.ts
      - src/scripts/variants.ts
      - src/scripts/globalIdentifiers.ts
      - features.json
      - resources/desktop/**
      - src/desktop/data/**
      - src/web/apps/**
      - tsconfig*.json
      - src/desktop/cachePath*.ts
      - src/tools/desktop/local/cache/**

permissions:
  contents: read

env:
  WITH_DESKTOP: ${{ github.event_name != 'release' && !inputs.web_only }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: 'npm'
      - name: Generate SEA
        run: |
          npm ci
          npm run build:sea -- --platform linux-x64 --variant ${{ env.WITH_DESKTOP == 'true' && 'default desktop' || 'default' }}
          cp build/sea/default/linux-x64/tableau-mcp tableau-mcp
      - name: Copy Desktop SEA
        if: env.WITH_DESKTOP == 'true'
        run: cp build/sea/desktop/linux-x64/tableau-mcp-desktop tableau-mcp-desktop
      - name: Test cache path containment
        if: env.WITH_DESKTOP == 'true'
        run: >-
          npx --no-install vitest run
          src/desktop/cachePath.test.ts
          src/tools/desktop/local/cache/readCachedXml.test.ts
          src/tools/desktop/local/cache/writeCachedXml.test.ts
          src/tools/desktop/local/cache/cacheContainment.integration.test.ts
          --maxWorkers=2
      - name: Smoke Desktop SEA
        if: env.WITH_DESKTOP == 'true'
        run: npx tsx src/scripts/seaSmoke.ts ./tableau-mcp-desktop --require-tool bind-template
      - name: Smoke web SEA
        if: github.event_name != 'pull_request'
        run: npx tsx src/scripts/seaSmoke.ts ./tableau-mcp
        env:
          SERVER: ${{ secrets.E2E_TEST_SERVER }}
          AUTH: ${{ secrets.E2E_TEST_AUTH }}
          SITE_NAME: ${{ secrets.E2E_TEST_SITE_NAME }}
          JWT_SUB_CLAIM: ${{ secrets.E2E_TEST_JWT_SUB_CLAIM }}
          CONNECTED_APP_CLIENT_ID: ${{ secrets.E2E_TEST_CONNECTED_APP_CLIENT_ID }}
          CONNECTED_APP_SECRET_ID: ${{ secrets.E2E_TEST_CONNECTED_APP_SECRET_ID }}
          CONNECTED_APP_SECRET_VALUE: ${{ secrets.E2E_TEST_CONNECTED_APP_SECRET_VALUE }}
      - name: Package archive (Web only)
        if: env.WITH_DESKTOP != 'true'
        run: tar -czf tableau-mcp.tar.gz tableau-mcp
      - name: Package archive (Web and Desktop)
        if: env.WITH_DESKTOP == 'true'
        run: tar -czf tableau-mcp.tar.gz tableau-mcp tableau-mcp-desktop
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: tableau-mcp.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: 'npm'
      - name: Generate SEA
        shell: pwsh
        run: |
          npm ci
          npm run build:sea -- --platform win-x64 --variant ${{ env.WITH_DESKTOP == 'true' && 'default desktop' || 'default' }}
          Copy-Item -Path .\build\sea\default\win-x64\tableau-mcp.exe -Destination .\tableau-mcp.exe
      - name: Copy Desktop SEA
        if: env.WITH_DESKTOP == 'true'
        shell: pwsh
        run: Copy-Item -Path .\build\sea\desktop\win-x64\tableau-mcp-desktop.exe -Destination .\tableau-mcp-desktop.exe
      - name: Test cache path containment
        if: env.WITH_DESKTOP == 'true'
        shell: pwsh
        run: |
          npx --no-install vitest run src/desktop/cachePath.test.ts src/tools/desktop/local/cache/readCachedXml.test.ts src/tools/desktop/local/cache/writeCachedXml.test.ts src/tools/desktop/local/cache/cacheContainment.integration.test.ts --maxWorkers=2
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }
      - name: Smoke Desktop SEA
        if: env.WITH_DESKTOP == 'true'
        shell: pwsh
        run: |
          npx tsx src/scripts/seaSmoke.ts .\tableau-mcp-desktop.exe --require-tool bind-template
          if ($LASTEXITCODE -ne 0) {
            throw "tableau-mcp-desktop.exe smoke failed"
          }
      - name: Smoke web SEA
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          npx tsx src/scripts/seaSmoke.ts .\tableau-mcp.exe
          if ($LASTEXITCODE -ne 0) {
            throw "tableau-mcp.exe smoke failed"
          }
        env:
          SERVER: ${{ secrets.E2E_TEST_SERVER }}
          AUTH: ${{ secrets.E2E_TEST_AUTH }}
          SITE_NAME: ${{ secrets.E2E_TEST_SITE_NAME }}
          JWT_SUB_CLAIM: ${{ secrets.E2E_TEST_JWT_SUB_CLAIM }}
          CONNECTED_APP_CLIENT_ID: ${{ secrets.E2E_TEST_CONNECTED_APP_CLIENT_ID }}
          CONNECTED_APP_SECRET_ID: ${{ secrets.E2E_TEST_CONNECTED_APP_SECRET_ID }}
          CONNECTED_APP_SECRET_VALUE: ${{ secrets.E2E_TEST_CONNECTED_APP_SECRET_VALUE }}
      - name: Package archive (Web only)
        if: env.WITH_DESKTOP != 'true'
        shell: pwsh
        run: Compress-Archive -Path tableau-mcp.exe -DestinationPath tableau-mcp.zip
      - name: Package archive (Web and Desktop)
        if: env.WITH_DESKTOP == 'true'
        shell: pwsh
        run: Compress-Archive -Path tableau-mcp.exe, tableau-mcp-desktop.exe -DestinationPath tableau-mcp.zip
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: tableau-mcp.zip
          if-no-files-found: error

  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
            archive: tableau-mcp-macos-arm64.tar.gz
          - runner: macos-15-intel
            platform: macos-x64
            archive: tableau-mcp-macos-x64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: 'npm'
      - name: Generate SEA
        run: |
          npm ci
          npm run build:sea -- --platform "${{ matrix.platform }}" --variant ${{ env.WITH_DESKTOP == 'true' && 'default desktop' || 'default' }}
          cp "build/sea/default/${{ matrix.platform }}/tableau-mcp" tableau-mcp
          chmod +x tableau-mcp
      - name: Copy Desktop SEA
        if: env.WITH_DESKTOP == 'true'
        run: |
          cp "build/sea/desktop/${{ matrix.platform }}/tableau-mcp-desktop" tableau-mcp-desktop
          chmod +x tableau-mcp-desktop
      - name: Test cache path containment
        if: env.WITH_DESKTOP == 'true'
        run: >-
          npx --no-install vitest run
          src/desktop/cachePath.test.ts
          src/tools/desktop/local/cache/readCachedXml.test.ts
          src/tools/desktop/local/cache/writeCachedXml.test.ts
          src/tools/desktop/local/cache/cacheContainment.integration.test.ts
          --maxWorkers=2
      - name: Smoke Desktop SEA
        if: env.WITH_DESKTOP == 'true'
        run: npx tsx src/scripts/seaSmoke.ts ./tableau-mcp-desktop --require-tool bind-template
      - name: Smoke web SEA
        if: github.event_name != 'pull_request'
        run: npx tsx src/scripts/seaSmoke.ts ./tableau-mcp
        env:
          SERVER: ${{ secrets.E2E_TEST_SERVER }}
          AUTH: ${{ secrets.E2E_TEST_AUTH }}
          SITE_NAME: ${{ secrets.E2E_TEST_SITE_NAME }}
          JWT_SUB_CLAIM: ${{ secrets.E2E_TEST_JWT_SUB_CLAIM }}
          CONNECTED_APP_CLIENT_ID: ${{ secrets.E2E_TEST_CONNECTED_APP_CLIENT_ID }}
          CONNECTED_APP_SECRET_ID: ${{ secrets.E2E_TEST_CONNECTED_APP_SECRET_ID }}
          CONNECTED_APP_SECRET_VALUE: ${{ secrets.E2E_TEST_CONNECTED_APP_SECRET_VALUE }}
      - name: Package archive (Web only)
        if: env.WITH_DESKTOP != 'true'
        run: tar -czf "${{ matrix.archive }}" tableau-mcp
      - name: Package archive (Web and Desktop)
        if: env.WITH_DESKTOP == 'true'
        run: tar -czf "${{ matrix.archive }}" tableau-mcp tableau-mcp-desktop
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  upload-release-assets:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
      - name: Upload archives to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            tableau-mcp.tar.gz \
            tableau-mcp.zip \
            tableau-mcp-macos-arm64.tar.gz \
            tableau-mcp-macos-x64.tar.gz
