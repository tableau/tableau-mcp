name: Generate NodeJS Single Executable Application

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '>=22.7.5'
          cache: 'npm'
      - name: Pin npm for min-release-age
        run: npm install -g npm@11.10.0
      - name: Generate SEA
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SERVER: ${{ secrets.E2E_TEST_SERVER }}
          AUTH: ${{ secrets.E2E_TEST_AUTH }}
          SITE_NAME: ${{ secrets.E2E_TEST_SITE_NAME }}
          JWT_SUB_CLAIM: ${{ secrets.E2E_TEST_JWT_SUB_CLAIM }}
          CONNECTED_APP_CLIENT_ID: ${{ secrets.E2E_TEST_CONNECTED_APP_CLIENT_ID }}
          CONNECTED_APP_SECRET_ID: ${{ secrets.E2E_TEST_CONNECTED_APP_SECRET_ID }}
          CONNECTED_APP_SECRET_VALUE: ${{ secrets.E2E_TEST_CONNECTED_APP_SECRET_VALUE }}
        run: |
          git fetch --tags
          git checkout -b sea-linux "$RELEASE_TAG"
          npm ci --ignore-scripts
          npm run build
          node --experimental-sea-config sea-config.json
          cp $(command -v node) tableau-mcp
          npx -y postject tableau-mcp NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          ./tableau-mcp &
          if [ $? -eq 0 ]; then
            echo "tableau-mcp started successfully"
            pkill -f tableau-mcp
          else
            echo "tableau-mcp failed to start"
            exit 1
          fi
          tar -czf tableau-mcp.tar.gz tableau-mcp
      - name: Upload archive to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" tableau-mcp.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '>=22.7.5'
          cache: 'npm'
      - name: Pin npm for min-release-age
        run: npm install -g npm@11.10.0
      - name: Generate SEA
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SERVER: ${{ secrets.E2E_TEST_SERVER }}
          AUTH: ${{ secrets.E2E_TEST_AUTH }}
          SITE_NAME: ${{ secrets.E2E_TEST_SITE_NAME }}
          JWT_SUB_CLAIM: ${{ secrets.E2E_TEST_JWT_SUB_CLAIM }}
          CONNECTED_APP_CLIENT_ID: ${{ secrets.E2E_TEST_CONNECTED_APP_CLIENT_ID }}
          CONNECTED_APP_SECRET_ID: ${{ secrets.E2E_TEST_CONNECTED_APP_SECRET_ID }}
          CONNECTED_APP_SECRET_VALUE: ${{ secrets.E2E_TEST_CONNECTED_APP_SECRET_VALUE }}
        run: |
          git fetch --tags
          git checkout -b sea-windows $env:RELEASE_TAG
          npm ci --ignore-scripts
          npm run build

          node --experimental-sea-config sea-config.json
          node -e "require('fs').copyFileSync(process.execPath, 'tableau-mcp.exe')"
          npx -y postject tableau-mcp.exe NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

          Start-Process -FilePath .\tableau-mcp.exe -NoNewWindow -ErrorAction SilentlyContinue
          $processId = Get-Process -Name tableau-mcp -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id

          if ($processId) {
            Write-Host "tableau-mcp.exe is running"
            Stop-Process -Id $processId -Force
          } else {
            Write-Host "tableau-mcp.exe failed to start"
            exit 1
          }
          Compress-Archive -Path tableau-mcp.exe -DestinationPath tableau-mcp.zip
      - name: Upload zip to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" tableau-mcp.zip
