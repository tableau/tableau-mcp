name: Test deployment

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./docs

on:
  pull_request:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: npm

      # min-release-age in .npmrc requires npm 11.10+. Node 20/22 ships npm 10, which ignores the key.
      - name: Pin npm for install-time cooldown
        run: npm install -g npm@11.10.0

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify docs tool-name guard logic
        run: npm run test:guard
      - name: Check docs for removed tool-name references
        run: npm run check:tool-names
      - name: Test build website
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          if-no-files-found: error
          path: |
            docs/build/
